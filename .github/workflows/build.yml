name: build

# Her push / PR: testler, gercek Windows smoke testi, exe + zip paketi ve install.ps1'in
# kur / guncelle / kaldir denemesi. Surum yayimlamak icin: Actions > release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      # Birim testlerinde run_ps hep monkeypatch'li; gercek powershell.exe
      # ve codepage davranisini yalnizca bu adim dogruluyor.
      - name: PowerShell smoke test (gercek Windows)
        run: python tests/smoke_windows.py

      - name: Build exe and zip
        shell: pwsh
        run: ./tools/build.ps1 -Version 0.0.${{ github.run_number }}

      - name: install.ps1 - install, update, uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\bt-tray-win'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\bt-tray-win'
          $env:BTTRAY_SOURCE = (Resolve-Path 'dist/bt-tray-*-windows-x64.zip').Path
          $env:BTTRAY_DEFAULTS = '1'
          ./install.ps1
          if (-not (Test-Path "$dir\bt-tray.exe") -or -not (Test-Path "$dir\uninstall.ps1")) { throw 'not installed' }
          if ((Get-ItemProperty $key).DisplayVersion -ne '0.0.${{ github.run_number }}') { throw 'wrong version in Apps' }
          ./install.ps1
          if (-not (Test-Path "$dir\bt-tray.exe")) { throw 'update failed' }
          if (Get-ChildItem (Split-Path $dir) -Filter '.bt-tray-win-*' -Force) { throw 'leftover staging folder' }
          $env:BTTRAY_UNINSTALL = '1'
          ./install.ps1
          if ((Test-Path $dir) -or (Test-Path $key)) { throw 'uninstall left files behind' }
          'install / update / uninstall ok'

      # The windowed setup app (installer/gui): builds both exes, draws every page and proves it starts and talks to install.ps1
      - name: Setup app - build x64 / x86, draw the pages, install and remove it through the window
        shell: pwsh
        run: |
          $env:BTTRAY_SOURCE = (Resolve-Path 'dist/bt-tray-*-windows-x64.zip').Path
          ./installer/gui/build.ps1 -Out dist -Shots -Smoke install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-tray
          path: |
            dist/bt-tray.exe
            dist/bt-tray-*-windows-x64.zip
            dist/*.sha256
            dist/bt-tray-Setup-*.exe
            dist/shots/*.png
            dist/smoke/*
