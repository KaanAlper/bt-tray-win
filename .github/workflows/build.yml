name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      # Testlerde run_ps her zaman monkeypatch'li; gercek PowerShell+codepage
      # yolunu yalnizca bu adim dogruluyor (Turkce karakterli cikti).
      - name: PowerShell encoding smoke test
        shell: python
        run: |
          import sys
          import bt_tray
          out = bt_tray.run_ps("Write-Output 'sukru GIDA ozgur cig ISIK'")
          print("stdout:", repr(out))
          assert "sukru GIDA ozgur cig ISIK" in out, out
          turkish = bt_tray.run_ps(
              "Write-Output ([char]0x015F + [char]0x0131 + [char]0x011F "
              "+ [char]0x00FC + [char]0x00F6 + [char]0x00E7)")
          print("turkce:", repr(turkish))
          assert turkish.strip() == "\u015f\u0131\u011f\u00fc\u00f6\u00e7", turkish
          devices = bt_tray.find_hfp_devices()
          print("HFP aygitlari:", devices)
          assert isinstance(devices, list)

      - name: Build single-file exe
        run: >
          pyinstaller --onefile --noconsole --uac-admin
          --name bt-tray
          bt_tray.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-tray-exe
          path: dist/bt-tray.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bt-tray.exe
          generate_release_notes: true
