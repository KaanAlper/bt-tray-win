name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      # Birim testlerinde run_ps hep monkeypatch'li; gercek powershell.exe
      # ve codepage davranisini yalnizca bu adim dogruluyor.
      - name: PowerShell smoke test (gercek Windows)
        run: python tests/smoke_windows.py

      - name: Build single-file exe
        run: >
          pyinstaller --onefile --noconsole --uac-admin
          --name bt-tray
          bt_tray.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-tray-exe
          path: dist/bt-tray.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bt-tray.exe
          generate_release_notes: true
